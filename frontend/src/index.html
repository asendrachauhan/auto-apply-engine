<body style="margin:0;">
  <app-root>
    <div id="aa-app-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030712;overflow:hidden;z-index:99999;font-family:'Space Grotesk',system-ui,sans-serif;">
      <!-- Ambient Gradient Glow Orbs -->
      <div style="position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(34,230,242,0.18) 0%,rgba(8,124,245,0.06) 50%,transparent 70%);top:20%;left:50%;transform:translate(-50%,-50%);filter:blur(60px);animation:aaPulseOrb 4s ease-in-out infinite alternate;pointer-events:none;"></div>
      <div style="position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(212,61,255,0.14) 0%,rgba(74,59,255,0.05) 50%,transparent 70%);bottom:20%;left:50%;transform:translate(-50%,50%);filter:blur(60px);animation:aaPulseOrb2 5s ease-in-out infinite alternate;pointer-events:none;"></div>

      <!-- Glassmorphic Splash Container -->
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;padding:36px 42px;background:rgba(15,23,42,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,0.6),0 0 40px rgba(34,230,242,0.1);max-width:90%;width:380px;box-sizing:border-box;">
        
        <!-- Animated Orbital Core Graphic -->
        <div style="position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <!-- Outer Gyroscopic Radar Ring -->
          <div style="position:absolute;inset:0;border:1.5px dashed rgba(34,230,242,0.45);border-radius:50%;animation:aaSpin 10s linear infinite;"></div>
          <!-- Inner Counter-Rotating Ring -->
          <div style="position:absolute;inset:12px;border:1px solid rgba(212,61,255,0.3);border-top-color:#d43dff;border-right-color:transparent;border-radius:50%;animation:aaSpinReverse 7s linear infinite;"></div>
          <!-- Orbiting Satellite Dot -->
          <div style="position:absolute;inset:0;border-radius:50%;animation:aaSpin 4s linear infinite;">
            <div style="position:absolute;top:4px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#22e6f2;box-shadow:0 0 10px #22e6f2,0 0 20px #22e6f2;"></div>
          </div>
          <!-- Glowing Center Brand Emblem -->
          <div style="position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center;animation:aaBreathe 3s ease-in-out infinite;">
            <img src="assets/logos/06-logo-mark-only.svg" alt="AutoApply AI" style="width:100%;height:auto;filter:drop-shadow(0 0 14px rgba(34,230,242,0.6));" />
          </div>
        </div>

        <!-- Typography & Brand Mark -->
        <div style="display:flex;align-items:center;gap:3px;font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;margin-bottom:4px;">
          AutoApply<span style="background:linear-gradient(135deg,#22e6f2,#d43dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">AI</span>
        </div>
        <div style="font-size:10px;font-weight:600;letter-spacing:2px;color:rgba(148,163,184,0.9);text-transform:uppercase;margin-bottom:20px;">
          Autonomous Job Engine
        </div>

        <!-- Dynamic High-Tech Progress Bar -->
        <div style="width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;position:relative;margin-bottom:14px;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:45%;background:linear-gradient(90deg,#22e6f2,#087cf5,#d43dff);border-radius:99px;animation:aaShimmerBar 1.5s infinite ease-in-out;box-shadow:0 0 12px rgba(34,230,242,0.6);"></div>
        </div>

        <!-- Cycling Status Ticker -->
        <div style="font-size:11.5px;font-weight:500;color:#94a3b8;height:18px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;width:100%;">
          <span style="animation:aaTickerCycle 8s infinite ease-in-out;white-space:nowrap;display:inline-block;">
            Syncing Naukri, LinkedIn &amp; Indeed pipelines...
          </span>
        </div>
      </div>

      <style>
        @keyframes aaSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes aaSpinReverse {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
        }
        @keyframes aaBreathe {
          0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(34,230,242,0.5)); }
          50% { transform: scale(1.08); filter: drop-shadow(0 0 22px rgba(34,230,242,0.85)); }
        }
        @keyframes aaPulseOrb {
          0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
          100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
        }
        @keyframes aaPulseOrb2 {
          0% { transform: translate(-50%, 50%) scale(1.1); opacity: 0.5; }
          100% { transform: translate(-50%, 50%) scale(0.85); opacity: 0.85; }
        }
        @keyframes aaShimmerBar {
          0% { left: -50%; width: 35%; }
          50% { width: 55%; }
          100% { left: 100%; width: 35%; }
        }
        @keyframes aaTickerCycle {
          0%, 20% { opacity: 0; transform: translateY(8px); }
          25%, 45% { opacity: 1; transform: translateY(0); }
          48%, 52% { opacity: 0; transform: translateY(-8px); }
          55%, 75% { opacity: 1; transform: translateY(0); }
          78%, 82% { opacity: 0; transform: translateY(-8px); }
          85%, 98% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(8px); }
        }
      </style>
    </div>
  </app-root>
</body>
